name: Compilar APK MO-NA Admin
on:
  workflow_dispatch:
  push:
    paths:
      - 'android-admin/**'
      - '.github/workflows/android-apk.yml'
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar SDK Android
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Preparar icono MO-NA
        run: |
          python3 -m pip install --user pillow
          python3 - <<'PY'
          from PIL import Image,ImageOps
          from pathlib import Path
          source=Image.open('../mona-logo.webp').convert('RGBA')
          for folder,size in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              out=Path('app/src/main/res/mipmap-'+folder)
              out.mkdir(parents=True,exist_ok=True)
              canvas=Image.new('RGBA',(size,size),'#fff1f5')
              logo=ImageOps.contain(source,(int(size*.84),int(size*.84)))
              canvas.alpha_composite(logo,((size-logo.width)//2,(size-logo.height)//2))
              canvas.save(out/'ic_launcher.png')
          PY
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compilar APK
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MO-NA-Administracion-APK
          path: android-admin/app/build/outputs/apk/debug/app-debug.apk
