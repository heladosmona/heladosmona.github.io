<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MO-NA | Administración</title><link rel="stylesheet" href="style.css?v=20"></head><body><main><header><img src="mona-logo.webp" alt="MO-NA" style="width:min(180px,65%);display:block;margin:auto"><p>Administración de carta</p></header><p><a href="index.html">← Ver carta</a></p><p id="status" role="status">Preparando inicio de sesión...</p><section id="login" class="panel"><h2>Ingresar</h2><form id="loginForm" onsubmit="event.preventDefault()"><label>Correo<input name="email" type="email" autocomplete="username" required></label><label>Contraseña<input name="password" type="password" autocomplete="current-password" required></label><button>Iniciar sesión</button></form><button type="button" id="forgotPassword">¿Olvidaste tu contraseña?</button><form id="recoveryForm" hidden><h3>Recuperar contraseña</h3><label>Correo registrado<input name="email" type="email" autocomplete="email" required></label><button type="submit">Enviar enlace de recuperación</button></form></section><section id="resetSection" class="panel" hidden><h2>Crear nueva contraseña</h2><form id="resetPasswordForm"><label>Nueva contraseña<input name="password" type="password" minlength="8" autocomplete="new-password" required></label><button type="submit">Guardar nueva contraseña</button></form></section><div id="workspace" hidden><button id="logout" type="button">Cerrar sesión</button><section class="panel add-product"><h2>🍦 Agregar producto</h2><form id="newProduct"><label>1. Categoría<select name="category" id="newCategory"><option value="" selected disabled>Selecciona una categoría</option><option>Helados</option><option>Cuchuflís</option><option>Café de grano</option></select></label><label>2. Nombre del producto<input name="name" placeholder="Ej. Chocolate" required></label><div id="newIcePrices" hidden><label>3. Precio helado simple ($)<input name="simple" type="number" min="0" inputmode="numeric" placeholder="Ej. 2000"></label><label>4. Precio helado doble ($)<input name="double" type="number" min="0" inputmode="numeric" placeholder="Ej. 3500"></label></div><div id="newSinglePrice" hidden><label>3. Precio ($)<input name="price" type="number" min="0" inputmode="numeric" placeholder="Ej. 2500"></label></div><label>📷 Fotografía del producto (opcional)<input name="photo" id="newProductPhoto" type="file" accept="image/jpeg,image/png,image/webp" capture="environment"></label><div id="newPhotoPreview" hidden style="margin:10px 0"><img id="newPhotoPreviewImage" alt="Vista previa de la fotografía" style="max-width:180px;max-height:180px;object-fit:contain;border-radius:12px"></div><button type="submit">Guardar producto</button></form></section><div id="admin"></div><section class="panel"><h2>Datos bancarios</h2><div id="bank"></div></section></div></main><script type="module">
try {
  const {createClient}=await import('https://esm.sh/@supabase/supabase-js@2.57.0');
  window.supabase={createClient};
  const app=await import('./shared.js?v=20');
  await app.initAdmin();
} catch(e) {
  console.error(e);
  document.getElementById('status').textContent='Error al iniciar: '+e.message;
}
</script></body></html>
